name: Bug report
description: Report a reproducible problem with Vextra.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Vextra version, browser/version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a public video URL and caption language/type if relevant. Keep credentials, private transcripts and browser-profile data out of the report.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Error message or screenshot
      description: Remove personal information before attaching files.
